spring.application.name=shopsphere-backend
server.port=8080

# Environment / Profile setup
# Set SPRING_PROFILES_ACTIVE=mysql to run against MySQL 8
spring.profiles.active=dev

# Global JWT Configuration
app.jwt.secret=9a6e8df4598d1a2f64c18a0b3c5e7f9a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d1e
app.jwt.expiration-ms=86400000

# Razorpay Test Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_shopsphere123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret_shopsphere456}

# JPA Settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Default Dev Datasource (H2 with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:file:./data/shopspheredb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
